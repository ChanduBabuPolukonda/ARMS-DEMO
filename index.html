<style>
:root{
 --bg:#f5f6fa;--sf:#ffffff;--sf2:#f8f9fc;--sf3:#eef0f6;--ink:#0f172a;--ink2:#334155;--mu:#64748b;--ln:#e5e8f0;--ln2:#d5dae6;
 --pr:#4f46e5;--pr2:#4338ca;--prs:#eef0ff;--prt:#c7cbff;--onpr:#fff;
 --gr:#059669;--grs:#e7f8f1;--rd:#e11d48;--rds:#fde9ee;--am:#b45309;--ams:#fdf3e1;--sk:#0284c7;--sks:#e5f4fc;--vi:#7c3aed;--vis:#f1eafe;--te:#0d9488;--tes:#e2f6f4;
 --sb:#0b1020;--sb2:#141a30;--sbi:#a3acc7;--sbt:#fff;--sbl:#1a2140;--sbl2:#262f50;--sbs:#5d6788;--sba:linear-gradient(90deg,rgba(99,102,241,.22),rgba(99,102,241,.06));--sbm:#818cf8;--cap:#0f1b2d;--plbg:#eef3f8;
 --sh1:0 1px 2px rgba(15,23,42,.05);--sh3:0 24px 60px rgba(15,23,42,.22);
 --r:14px;--rs:9px;--ff:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --c1:#4f46e5;--c2:#818cf8;--c3:#a5b4fc;--c4:#c7d2fe;--c5:#6366f1;--c6:#4f46e5;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ff);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}a{color:var(--pr);text-decoration:none}small,.mu{color:var(--mu)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--rs);padding:8px 11px;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prs)}
textarea{width:100%;font:12px/1.5 ui-monospace,'Cascadia Code',Consolas,monospace;background:var(--sf2)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--sf);border:1px solid var(--ln2);border-radius:var(--rs);padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--ink2);box-shadow:var(--sh1);transition:all .15s}
.btn:hover{background:var(--sf2);border-color:var(--mu)}.btn svg.i{width:16px;height:16px}
.btn.pr{background:var(--pr);border-color:var(--pr);color:var(--onpr)}.btn.pr:hover{background:var(--pr2);border-color:var(--pr2)}
.btn.rd{color:var(--rd)}.btn.rd:hover{background:var(--rds);border-color:var(--rd)}
.btn.sm{padding:5px 10px;font-size:12.5px}.btn.gh{background:transparent;border-color:transparent;box-shadow:none}.btn.gh:hover{background:var(--sf3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.sb{width:256px;background:var(--sb);color:var(--sbi);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:25}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#14b8a6);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(99,102,241,.4)}
.brand small{display:block;color:var(--mu);font-weight:500;font-size:11px;letter-spacing:.02em}
.org{margin:4px 12px 10px;background:var(--sb2);border:1px solid #1f2742;border-radius:11px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.org b{color:#fff;font-size:13px;display:block;line-height:1.3}.org small{color:var(--sbi);font-size:11.5px}
.navs{flex:1;overflow:auto;padding:4px 10px 16px}
.navs .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#5d6788;margin:16px 10px 6px;font-weight:600}
.navs a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--sbi);font-weight:500;font-size:13.5px;cursor:pointer;position:relative}
.navs a:hover{background:var(--sb2);color:#fff}
.navs a.on{background:linear-gradient(90deg,rgba(99,102,241,.22),rgba(99,102,241,.06));color:#fff}
.navs a.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#818cf8}
.navs a .cnt{margin-left:auto;background:#262f50;color:#c7cdf0;font-size:11px;padding:1px 7px;border-radius:10px}
.sbf{padding:12px 18px;border-top:1px solid #1a2140;font-size:11.5px;color:#5d6788}
.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{height:62px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20}
.crumb{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px;white-space:nowrap}.crumb b{color:var(--ink);font-weight:600}.crumb svg.i{width:14px;height:14px}
.gs{position:relative;margin-left:auto;width:300px;max-width:32vw}
.gs input{width:100%;padding-left:36px;background:var(--sf2);border-color:var(--ln)}.gs>svg{position:absolute;left:11px;top:10px;color:var(--mu);width:16px;height:16px}
.gs kbd{position:absolute;right:9px;top:8px;font:11px var(--ff);color:var(--mu);border:1px solid var(--ln2);border-radius:5px;padding:1px 6px;background:var(--sf)}
.gsr{position:absolute;top:44px;left:0;right:0;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh3);padding:6px;display:none}
.gsr a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);cursor:pointer}.gsr a:hover,.gsr a.hi{background:var(--prs)}.gsr small{margin-left:auto}
.live{display:flex;align-items:center;gap:8px;background:var(--grs);color:var(--gr);font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.live.wait{background:var(--ams);color:var(--am)}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;cursor:pointer;color:var(--ink2);position:relative;flex-shrink:0}
.ib:hover{background:var(--sf2)}.ib .dotc{position:absolute;top:-5px;right:-5px;background:var(--rd);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--sf)}
.um{position:relative}.umb{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:12px;border:1px solid transparent}.umb:hover{background:var(--sf2);border-color:var(--ln)}
.umb b{font-size:13px;display:block;line-height:1.2;white-space:nowrap}.umb small{font-size:11.5px}
.umd{position:absolute;right:0;top:50px;width:250px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh3);padding:8px;display:none}
.umd.open,.gsr.open{display:block}.umd .hd{padding:10px;border-bottom:1px solid var(--ln);margin-bottom:6px}
.umd a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink2);cursor:pointer}.umd a:hover{background:var(--sf2)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex-shrink:0}
.av.s{width:30px;height:30px;border-radius:8px;font-size:11px}
.hamb{display:none}
.ct{padding:26px 28px 120px;max-width:1440px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:700;letter-spacing:-.02em}.ph p{color:var(--mu);margin-top:3px}.ph .act{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- cards ---------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh1);margin-bottom:18px;overflow:hidden}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.card>.ch h3{font-size:15px;font-weight:600;letter-spacing:-.01em}.card>.ch p{font-size:12.5px;color:var(--mu);margin-top:1px}
.card>.cb{padding:20px}.card>.cb.np{padding:0}.card>.cb.np>.tw{border:0;border-radius:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.g32{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}.row{margin-bottom:18px}.row>.card{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px 18px 14px;box-shadow:var(--sh1)}
.kpi .top{display:flex;align-items:center;justify-content:space-between}.kpi .lb{color:var(--mu);font-size:13px;font-weight:500}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.kpi .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}.kpi .ft small{font-size:12px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px}.delta svg.i{width:13px;height:13px;stroke-width:2.4}
.delta.up{color:var(--gr);background:var(--grs)}.delta.dn{color:var(--rd);background:var(--rds)}.delta.fl{color:var(--mu);background:var(--sf3)}
.tone-1{background:var(--prs);color:var(--pr)}.tone-2{background:var(--tes);color:var(--te)}.tone-3{background:var(--ams);color:var(--am)}.tone-4{background:var(--vis);color:var(--vi)}.tone-5{background:var(--sks);color:var(--sk)}
/* charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mu);font-size:11px;font-family:var(--ff)}.chart .gl{stroke:var(--ln);stroke-dasharray:3 4}
.chart .pt rect.hit{fill:transparent}.chart .pt .tt,.chart .pt line,.chart .pt circle{opacity:0;transition:opacity .12s}
.chart .pt:hover .tt,.chart .pt:hover line,.chart .pt:hover circle{opacity:1}

.sbtg{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--sbi);cursor:pointer;flex:none}
.sbtg:hover{background:var(--sbl2);color:var(--sbt)}.sbtg svg{width:19px;height:19px}
.hamb2,.phl0{display:none!important}
@media (min-width:861px){.hamb{display:none!important}
 .app .sb{transition:width .2s ease}.app.sbc .sb{margin-left:0!important;width:72px}
 .app.sbc .brand{padding:18px 0 10px;align-items:center}.app.sbc .brow{justify-content:center}.app.sbc .brand .wm,.app.sbc .brand small{display:none}
 .app.sbc .navs{padding-left:10px;padding-right:10px}.app.sbc .navs .sec{font-size:0;height:1px;background:var(--sbl);margin:12px 8px}
 .app.sbc .navs a{justify-content:center;padding:10px 0;gap:0}.app.sbc .navs a .nl,.app.sbc .navs a .cnt{display:none}
 .app.sbc .sbu{flex-direction:column;padding:12px 0;gap:8px}.app.sbc .sbu .who{display:none}}
/* content fills the width beside the sidebar (open or collapsed) */
.ct{max-width:none!important;flex:1;padding-bottom:32px!important}
/* collapsed rail: sign out only at the bottom */
@media (min-width:861px){.app.sbc .sbu .av{display:none}}
/* console: grab anywhere empty; controls keep their own cursor */
.dock{cursor:grab;touch-action:none;user-select:none}.dock button,.dock select{cursor:pointer}.dock.dragging{cursor:grabbing}
/* overview top items: rows spread over the card instead of floating in the middle */
.g32.row>.card>.cb>.hbar,.g2.row>.card>.cb>.hbar{flex:1;align-self:flex-start;justify-content:flex-start}
/* console drag: whole bar and minimised button */
.dock .db,.dockmin,.dockmin .btn{touch-action:none;user-select:none}.dockmin{cursor:grab}
/* full console is fixed again; minimised console is the draggable one */
.dock{cursor:default!important}.dockmin .btn{cursor:grab}.dockmin.dragging .btn{cursor:grabbing}
.ct{padding-bottom:110px!important}
/* sub-group tag picker */
.subp .tgrow{margin-bottom:8px}.subp .tgrow small{display:block;color:var(--mu);margin-bottom:4px}.subcnt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin-top:6px}.subcnt svg{width:15px;height:15px}
/* searchable selects, tag screens */
.ssel{width:100%}.ssel>select{display:none!important}.ssel .fbtn{width:100%;height:38px;font-weight:400;font-size:14px}.ssel .dd{width:100%;min-width:220px;padding:8px}
.ssel .fbtn:disabled{background:var(--sf3);color:var(--mu);cursor:default}.ssel .ddl .opt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.filters .ssel{min-width:240px}
.ssdk{width:auto}.ssdk .fbtn{width:200px;height:30px;padding:0 8px;background:#161d36;border-color:#2a3358;color:#e2e6f5;font-size:12.5px}.ssdk.ssth .fbtn{width:130px}
.ssdk .dd{top:auto;bottom:calc(100% + 8px);width:280px;text-align:left}.ssdk .fbtn svg.i{color:#8b94b8}
.tgv{display:flex;flex-wrap:wrap;gap:4px;max-width:520px}
.tgst,.tggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;grid-column:1/-1}.tgst .mtag .fbtn,.tggrid .mtag .fbtn,.tgst .msel,.tggrid .msel{width:100%}.tgst .msel .dd,.tggrid .msel .dd{width:100%}
.tgst>.fld,.tggrid>.fld{margin-bottom:12px}
.vchip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--ln2);border-radius:var(--rs);padding:6px;background:var(--sf)}.vchip .tags{display:contents}.vchip input{border:0;box-shadow:none!important;flex:1;min-width:120px;padding:4px 6px}
@media (max-width:860px){.tgst,.tggrid{grid-template-columns:1fr}}
/* multi-select: picks inside the dropdown */
.mtag .fbtn{width:100%}.mtag .mtl{display:flex;align-items:center;gap:6px;min-width:0}.mtag .mtl>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtn{flex:none;background:var(--prs);color:var(--pr);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px}
.mtag .dd{width:100%;min-width:240px;padding:8px}.mtag .ddl{max-height:220px;overflow:auto}
.ddl .mto{display:flex;align-items:center;gap:8px}.mto .mtt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mck{flex:none;width:16px;height:16px;border:1.5px solid var(--ln2);border-radius:4px;display:grid;place-items:center;background:var(--sf)}.mck svg.i{width:11px;height:11px;stroke-width:3;color:#fff;opacity:0}
.mto.on .mck{background:var(--pr);border-color:var(--pr)}.mto.on .mck svg.i{opacity:1}.ddl .mto.on{background:none;color:var(--ink);font-weight:500}.ddl .mto.on:hover{background:var(--sf2)}
.vchip{max-height:96px;overflow:auto}.vchip .tag{background:var(--prs)!important;color:var(--pr)!important;padding:3px 6px 3px 9px!important;border-radius:6px!important;font-size:12.5px}
/* row actions menu */
td.ac{width:1%;white-space:nowrap;text-align:left}
.amb{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink2)}.amb:hover,.amb.on{border-color:var(--pr);color:var(--pr);background:var(--prs)}.amb svg.i{width:16px;height:16px}
.amd{display:none;position:fixed;z-index:40;min-width:170px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;box-shadow:var(--sh3);padding:5px;text-align:left}.amd.open{display:block}
.amd .btn{display:flex!important;width:100%;justify-content:flex-start;gap:8px;border:0!important;background:none!important;box-shadow:none!important;padding:8px 10px!important;height:auto!important;border-radius:7px;color:var(--ink2);font-weight:500;margin:0}
.amd .btn:hover{background:var(--sf2)!important;color:var(--ink)}.amd .btn.rd{color:var(--rd,#dc2626)}.amd .btn svg.i{width:15px;height:15px}
td.ac>.amd{display:none!important}#amenu{min-width:140px;padding:4px}#amenu .btn{font-size:12px;padding:7px 9px!important}#amenu .btn svg.i{width:13px;height:13px}
.tggrid>.fld.full{grid-column:1/-1}
.mto.na{display:none!important}
.capx{display:flex;gap:8px;align-items:center;margin:4px 0 10px;grid-column:1/-1}
.strow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end;margin-bottom:10px}.strow .fld{margin:0}.strow .ib{width:38px;height:38px}.stadd{margin-top:2px}
@media (max-width:600px){.strow{grid-template-columns:1fr auto}.strow .fld:first-child{grid-column:1/-1}}
.stwrap{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%}#strows{width:100%;max-width:760px}.stadd{margin:0!important}.strow .ib{border-color:var(--ln2)}
.strow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 38px 112px}.strow .stadd{height:38px;white-space:nowrap}
@media (max-width:600px){.strow{grid-template-columns:1fr auto auto}}
.pform .cb>.subp{grid-column:1/-1}.subp .tggrid{gap:0 18px}
.stepper.ro .st{cursor:default}
</style>

function inc(O,t,key,f,sg){const T=O[t]||(O[t]={}),r=T[key]||(T[key]={});for(const x in f)r[x]=typeof f[x]=='number'?r2((r[x]||0)+sg*f[x]):f[x]}
function addTo(O,b,sg){
 if(b.status=='Cancelled')return;const k=b.store+'|'+b.date;
 inc(O,'daily',k,{bills:1,net:b.net,tax:b.tax,total:b.total},sg);inc(O,'hour',k+'|'+b.time.slice(0,2),{bills:1,items:b.lines.reduce((a,l)=>a+l.qty,0),net:b.net,total:b.total},sg);
 const seen=new Set();b.lines.forEach(l=>{inc(O,'item',k+'|'+l.name,{cat:l.cat,qty:l.qty,amt:l.amt,bills:seen.has(l.name)?0:1},sg);seen.add(l.name);inc(O,'tax',k+'|'+l.rate,{taxable:l.amt,tax:l.tax},sg);inc(O,'catg',k+'|'+l.cat,{qty:l.qty,amt:l.amt,gross:r2(l.amt+l.tax)},sg)});
 (b.pays||[{mode:b.mode,amt:b.total}]).forEach(x=>inc(O,'pay',k+'|'+x.mode,{bills:1,amt:x.amt},sg));
}
function applyBill(b,O=S.olap){const bd=O.bd||(O.bd={});if(bd[b.id])addTo(O,bd[b.id],-1);addTo(O,b,1);bd[b.id]=JSON.parse(JSON.stringify(b))}

function dockPlace(){const el=$('#dock .dockmin');if(!el||!dockPos)return;
 const x=Math.max(8,Math.min(dockPos.x,innerWidth-el.offsetWidth-8)),y=Math.max(8,Math.min(dockPos.y,innerHeight-el.offsetHeight-8));

function dockDrag(e){const el=e.currentTarget;if(e.button||e.target.closest('select,input,option'))return;const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;let on=false;
 const mv=ev=>{if(!on&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<4)return;on=true;el.classList.add('dragging');dockPos={x:ev.clientX-dx,y:ev.clientY-dy};dockPlace()};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);el.classList.remove('dragging');if(!on)return;
  const stop=ev=>{ev.stopPropagation();ev.preventDefault()};addEventListener('click',stop,true);setTimeout(()=>removeEventListener('click',stop,true),0);
  try{localStorage.setItem('urp-dock',JSON.stringify(dockPos))}catch(e){}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)}

function pLogin(){return authShell('Sign in',`<form onsubmit="event.preventDefault();doLogin(this)"> <label class="plfld"><span class="pll">Username</span><div class="plin">${ic('user')}<input name="u" autocomplete="username" value="abcfoods" autofocus></div></label>${pwField('p','Password','','Demo@123')}
 <button class="btn pr">Sign in</button><a class="plforgot" onclick="S.fp=null;go('forgot')">Forgot password?</a></form>`)}
const maskM=m=>'••••••'+String(m).slice(-4);
function pForgot(){const f=S.fp||(S.fp={step:'user'});
 const back=`<a class="plforgot" onclick="S.fp=null;go('login')">Back to sign in</a>`;
 if(f.step=='otp'){const left=Math.max(0,Math.ceil((f.resendAt-Date.now())/1000));
  return authShell('Enter OTP',`<form onsubmit="event.preventDefault();doOtp(this)"><p class="plsub">Sent to <b>${maskM(f.mobile)}</b></p>
  <label class="plfld"><span class="pll">OTP</span><input name="otp" class="otpin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"></label>
  <button class="btn pr">Verify</button><p class="rsd" id="rsd">${left?`Resend OTP in ${left}s`:`<a onclick="sendOtp(true)">Resend OTP</a>`}</p>${back}</form>`)}
 if(f.step=='new')return authShell('Set a new password',`<form onsubmit="event.preventDefault();doNewPw(this)">  ${pwField('a','New password')}${pwField('b','Confirm new password')}<p class="plrule">8+ characters, A–Z, a–z, 0–9 and a symbol.</p>
  <button class="btn pr">Update password</button>${back}</form>`);
 if(f.step=='done')return authShell('Password updated',`<div class="fdone"><span class="ic tone-5">${ic('check')}</span><button class="btn pr" onclick="S.fp=null;go('login')">Back to sign in</button></div>`);
 if(f.step=='admin')return authShell('Reset your password',`<div class="fdone"><span class="ic tone-5">${ic('info')}</span><p>No mobile on file. Your admin will share a temporary password.</p><button class="btn pr" onclick="S.fp=null;go('login')">Back to sign in</button></div>`);
 return authShell('Reset your password',`<form onsubmit="event.preventDefault();doForgot(this)"> <label class="plfld"><span class="pll">Username</span><div class="plin">${ic('user')}<input name="u" autocomplete="username"></div></label><button class="btn pr">Send OTP</button>${back}</form>`)}
function sendOtp(resend){const f=S.fp;f.otp=String(Math.floor(100000+Math.random()*900000));f.exp=Date.now()+5*60e3;f.tries=0;f.resendAt=Date.now()+30e3;f.step='otp';
 render();toast(`Demo: OTP ${f.otp} sent by SMS to ${maskM(f.mobile)}`,'in')}
function doForgot(form){const n=form.u.value.trim().toLowerCase();if(!n)return toast('Enter your username','rd');
 const u=S.users.find(x=>x.u==n);if(!u||!u.active)return toast('No active account with this username','rd');
 const mob=u.mobile||(u.type=='group'&&grp(u.groupId).mobile);S.fp={u:n};
 if(!mob){if(u.owner){u.resetReq=stamp();audit('Password reset requested',u.u)}S.fp.step='admin';render();return}
 S.fp.mobile=mob;audit('Password OTP sent',u.u);sendOtp()}
function doOtp(form){const f=S.fp,v=form.otp.value.trim();
 if(Date.now()>f.exp)return toast('OTP expired. Request a new one.','rd');
 if(v!==f.otp){f.tries++;if(f.tries>=3){S.fp={step:'user'};render();return toast('Too many wrong attempts. Start again.','rd')}return toast(`Incorrect OTP (${3-f.tries} attempts left)`,'rd')}
 f.step='new';render()}
function doNewPw(form){const f=S.fp,u=S.users.find(x=>x.u==f.u),a=form.a.value;
 if(!pwOk(a))return toast('Password does not meet the policy','rd');if(a!==form.b.value)return toast('Passwords do not match','rd');if(a===u.pw||u.hist.includes(a))return toast('Cannot reuse one of the last 3 passwords','rd');
 u.hist=[u.pw,...u.hist].slice(0,3);u.pw=a;u.temp=false;u.fails=0;u.lockUntil=0;u.resetReq=null;audit('Password reset via OTP',u.u,[['Password','—','Changed by user']]);f.step='done';render()}
setInterval(()=>{const r=document.getElementById('rsd');if(r&&S.fp&&S.fp.step=='otp'){const left=Math.max(0,Math.ceil((S.fp.resendAt-Date.now())/1000));r.innerHTML=left?`Resend OTP in ${left}s`:`<a onclick="sendOtp(true)">Resend OTP</a>`}},1000);
function doLogin(f){
 const u=S.users.find(x=>x.u==f.u.value.trim().toLowerCase()),e=m=>toast(m,'rd');
 if(!u)return e('Invalid username or password');
 if(u.lockUntil>Date.now())return e('Account locked for 15 minutes after 5 wrong tries. An admin can unlock it sooner (Users screen).');
 if(!u.active)return e('This user is disabled.');
 if(u.groupId&&!grp(u.groupId).active)return e('The group of this user is inactive.');
 if(u.pw!==f.p.value){u.fails++;if(u.fails>=5){u.lockUntil=Date.now()+15*60e3;ev('Dashboard API',`${u.u} locked for 15 min after 5 wrong passwords`);return e('Account locked for 15 minutes.')}return e(`Invalid username or password (${5-u.fails} tries left)`)}
 u.fails=0;S.me=u;ev('Dashboard API',`Sign-in OK for ${u.u}. Session started; products, permissions and ${myStores().length} store(s) loaded.${u.temp?' Temporary password → must change first.':''}`);
 go(firstRoute());
}
function pChangePw(){return authShell('Set a new password',`<form onsubmit="event.preventDefault();doChange(this)"><p class="plsub">Your password is temporary.</p>
 ${pwField('a','New password')}${pwField('b','Confirm new password')}
 <p class="plrule">8+ characters, A–Z, a–z, 0–9 and a symbol.</p>
 <button class="btn pr">Update password</button><a class="plforgot" onclick="logout()">Back to sign in</a></form>`)}
function doChange(f){const a=f.a.value,u=S.me,e=m=>toast(m,'rd');
 if(!pwOk(a))return e('Password does not meet the policy.');if(a!==f.b.value)return e('Passwords do not match.');
 if(a===u.pw||u.hist.includes(a))return e('Cannot reuse one of the last 3 passwords.');
 u.hist=[u.pw,...u.hist].slice(0,3);u.pw=a;u.temp=false;ev('Dashboard API',`${u.u} changed password (stored hashed only)`);toast('Password changed');go(firstRoute())}

const REPS={daily:'Daily Sales',bills:'Bill Wise Sales',items:'Product Sales',pay:'Media Sales',gst:'Tax Reports',hourly:'Hourly Sales',cat:'Category Sales'};
const FBL={5:['Excellent','gr'],4:['Good','gr'],3:['Average',''],2:['Poor','am'],1:['Bad','rd']};
function fbOf(b){const h=[...b.no].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);if(h%3)return{fb:'No feedback',fbh:'No feedback'};
 const [t,c]=FBL[[5,4,4,3,5,2,4,1][h%8]];return{fb:t,fbh:B(t,c)}}
function repData(kind,codes,from,to){
 const O=S.olap,inR=(c,d)=>codes.includes(c)&&d>=from&&d<=to,rows=[],agg={};let cols;
 const each=(t,fn)=>Object.entries(O[t]||{}).forEach(([k,v])=>{const p=k.split('|');if(inR(p[0],p[1]))fn(p,v)});
 const add=(k,o)=>{const r=agg[k]||(agg[k]={...o,_n:1});if(r._n++>1)for(const x in o)if(typeof o[x]=='number')r[x]=r2(r[x]+o[x])};
 if(kind=='daily'){cols=[['Date','date'],['Store','sc','h'],['Bills','bills','n'],['Net sales','net','m'],['Tax','tax','m'],['Gross','total','m']];
  each('daily',(p,v)=>v.bills&&rows.push({date:dshort(p[1]),_d:p[1],sc:scell(p[0]),store:sname(p[0]),...v}));rows.sort((a,b)=>b._d.localeCompare(a._d)||a.store.localeCompare(b.store));return{cols,rows}}
 if(kind=='items'){cols=[['Item','item'],['Category','cat'],['Price','price','m2'],['Bills','bills','n2'],['Qty','qty','n'],['Net amount','amt','m']];each('item',(p,v)=>add(p[2],{item:p[2],cat:v.cat,bills:v.bills,qty:v.qty,amt:v.amt}))}
 if(kind=='pay'){cols=[['Payment mode','mode'],['Bills','bills','n'],['Amount','amt','m']];each('pay',(p,v)=>add(p[2],{mode:p[2],bills:v.bills,amt:v.amt}))}
 if(kind=='gst'){cols=[['GST rate','rate'],['Taxable value','taxable','m'],['Tax','tax','m']];each('tax',(p,v)=>add(p[2],{rate:p[2]+'%',taxable:v.taxable,tax:v.tax}))}
 if(kind=='hourly'){cols=[['Hour','hr'],['Bills count','bills','n'],['Items count','items','n'],['Net sales','net','m'],['Gross','total','m']];each('hour',(p,v)=>add(p[2],{hr:p[2]+':00 – '+String(+p[2]+1).padStart(2,'0')+':00',_h:p[2],bills:v.bills,items:v.items||0,net:v.net,total:v.total}));
  return{cols,rows:Object.values(agg).filter(r=>r.bills).sort((a,b)=>a._h.localeCompare(b._h))}}
 if(kind=='cat'){cols=[['Category','cat'],['Qty','qty','n'],['Net amount','amt','m'],['Gross amount','gross','m']];each('catg',(p,v)=>add(p[2],{cat:p[2],qty:v.qty,amt:v.amt,gross:v.gross||0}));
  return{cols,rows:Object.values(agg).filter(r=>r.qty).sort((a,b)=>b.amt-a.amt)}}
 if(kind=='bills'){cols=[['Bill no','nob','h'],['Store','sc','h'],['Date & time','dt'],['Payment','mode'],['Status','st','h'],['Items','items','n'],['Net','net','m'],['Tax','tax','m'],['Bill value','total','m'],['Feedback','fbh','h']];
  return{cols,rows:Object.values(O.bd||{}).filter(b=>inR(b.store,b.date)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))
   .map(b=>({...b,nob:`<span class="mono">${b.no}</span>`,sc:scell(b.store),dt:dshort(b.date)+' · '+b.time,st:B(b.status,b.status=='Cancelled'?'rd':'gr'),items:b.lines.reduce((a,l)=>a+l.qty,0),...fbOf(b)}))}}
 return{cols,rows:Object.values(agg).filter(r=>r.qty!==0&&r.bills!==0).map(r=>kind=='items'?{...r,price:r.qty?r2(r.amt/r.qty):0}:r).sort((a,b)=>(b.amt||b.tax)-(a.amt||a.tax))};
}

function storePicker(list=myStores()){SPL=list;const ms=list,all=ms.length&&S.fd.stores.length==ms.length;
 return `<div class="msel" id="msel"><button type="button" class="fbtn" onclick="ddToggle('msel')">${ic('store')}<span id="mslbl">${storeLabel()}</span>${ic('chevd')}</button>
 <div class="dd"><div class="dds">${ic('search')}<input placeholder="Search stores" oninput="ddFilter(this.value)"></div>

let DSINGLE=false;

let P;
const PRE=[['Today',0,0],['Yesterday',-1,-1],['Last 7 Days',-6,0],['Last 30 Days',-29,0],['This Month','tm'],['Last Month','lm']];
function preRange(p){const d=new Date();if(p[1]=='tm')return[ds(new Date(d.getFullYear(),d.getMonth(),1)),D(0)];if(p[1]=='lm')return[ds(new Date(d.getFullYear(),d.getMonth()-1,1)),ds(new Date(d.getFullYear(),d.getMonth(),0))];return[D(p[1]),D(p[2])]}
function drpOpen(){const b=new Date((S.fd.to||D(0))+'T00:00');P={s:S.fd.from,e:S.fd.to,y:b.getFullYear(),m:b.getMonth()-(DSINGLE?0:1)};drpRender()}
function calM(y,m,prev,next){const f=new Date(y,m,1);y=f.getFullYear();m=f.getMonth();const n=new Date(y,m+1,0).getDate(),t=D(0);let c='';
 for(let i=0;i<f.getDay();i++)c+='<span></span>';
 for(let d=1;d<=n;d++){const k=ds(new Date(y,m,d)),off=k>t,cl=[(k==P.s||k==P.e)?'sel':'',P.s&&P.e&&k>P.s&&k<P.e?'in':'',k==t?'td':'',off?'off':''].join(' ');c+=`<button type="button" class="${cl}" ${off?'disabled':''} onclick="drpPick('${k}')">${d}</button>`}
 return `<div class="cal"><div class="calh">${prev?`<button type="button" class="btn gh sm" onclick="P.m--;drpRender()">${ic('chevl')}</button>`:'<span></span>'}<b>${f.toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</b>${next?`<button type="button" class="btn gh sm" onclick="P.m++;drpRender()">${ic('chev')}</button>`:'<span></span>'}</div><div class="calg">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<i>${x}</i>`).join('')}${c}</div></div>`}
function drpRender(){if(DSINGLE){$('#drpdd').innerHTML=`<div class="drpw"><div class="pre">${[['Today',D(0)],['Yesterday',D(-1)]].map(([l,d])=>`<button type="button" class="${P.s==d?'on':''}" onclick="drpPick('${d}')">${l}</button>`).join('')}</div><div class="cals">${calM(P.y,P.m,1,1)}</div></div>`;return}
 const cur=PRE.findIndex(p=>{const [a,b]=preRange(p);return a==P.s&&b==P.e});
 $('#drpdd').innerHTML=`<div class="drpw"><div class="pre">${PRE.map((p,i)=>`<button type="button" class="${i==cur?'on':''}" onclick="drpPre(${i})">${p[0]}</button>`).join('')}<button type="button" class="${cur<0&&P.s?'on':''}">Custom Range</button></div>
 <div><div class="cals">${calM(P.y,P.m,1,0)}${calM(P.y,P.m+1,0,1)}</div><div class="drpf"><small>${P.s?fmtD(P.s)+' – '+(P.e?fmtD(P.e):'…'):'Pick a start date'}</small><button type="button" class="btn sm" onclick="ddToggle('drp')">Cancel</button><button type="button" class="btn sm pr" ${P.s?'':'disabled'} onclick="drpApply()">Apply</button></div></div></div>`}
function drpPick(k){if(DSINGLE){P.s=P.e=k;drpApply();return}if(!P.s||P.e){P.s=k;P.e=''}else if(k<P.s)P.s=k;else P.e=k;drpRender()}
function drpPre(i){[P.s,P.e]=preRange(PRE[i]);drpApply()}
function drpApply(){S.fd.from=P.s;S.fd.to=P.e||P.s;$('#drp').classList.remove('open');$('#drlbl').innerHTML=dLabel(S.fd);updClr()}

 return `<div class="pager"><small>${(p-1)*PER+1}–${Math.min(p*PER,n)} of ${n}</small><div style="display:flex;gap:6px;align-items:center"><button class="btn sm" ${p>1?'':'disabled'} onclick="S.page--;render()">${ic('chevl')}</button><small>Page ${p} of ${pages}</small><button class="btn sm" ${p<pages?'':'disabled'} onclick="S.page++;render()">${ic('chev')}</button></div></div>`}

const XLIM=1000000;
function dlBWR(){const ap=S.ap,{rows}=repData('bills',ap.stores,ap.from,ap.to);
 const SH=[['Bills',[['Bill no','no'],['Store','store'],['Date','date'],['Time','time'],['Status','status'],['Net amount','net'],['Tax','tax'],['Bill total','total']],b=>[{no:b.no,store:sname(b.store),date:b.date,time:b.time,status:b.status,net:b.net,tax:b.tax,total:b.total}]],
  ['Items',[['Bill no','no'],['Store','store'],['Date','date'],['Item','item'],['Category','cat'],['Qty','qty'],['Price','price'],['Net amount','net'],['Tax %','rate'],['Tax','tax'],['Line total','total']],b=>b.lines.map(l=>({no:b.no,store:sname(b.store),date:b.date,item:l.name,cat:l.cat,qty:l.qty,price:r2(l.amt/l.qty),net:r2(l.amt),rate:l.rate,tax:l.tax,total:r2(l.amt+l.tax)}))],

 /* split by bills so no sheet in a file passes the Excel row limit */
 const parts=[];let cur=[],n=0;rows.forEach(b=>{const k=Math.max(b.lines.length,(b.pays||[1]).length);if(n+k>XLIM-1&&cur.length){parts.push(cur);cur=[];n=0}cur.push(b);n+=k});if(cur.length||!parts.length)parts.push(cur);
 const base=`Bill_Wise_Sales_${ap.from}_to_${ap.to}`;
 const ds=parts.map((bs,i)=>({id:S.downloads.length+1+i,name:base+(parts.length>1?`_part${i+1}`:'')+'.xlsx',at:stamp(),by:S.me.u,status:'Queued',bills:bs.length,sheets:SH.map(([nm,cols,f])=>({name:nm,cols,rows:bs.flatMap(f)}))}));
 S.downloads.unshift(...ds);toast('Preparing your file. It will be on the Downloads page.');render();
 setTimeout(()=>{ds.forEach(d=>d.status='Building');if(S.me&&!$('#modal').innerHTML&&!S.form&&PATH=='downloads')render()},1500);
 setTimeout(()=>{ds.forEach(d=>d.status='Ready');toast(`${ds[0].name} is ready on Downloads`);if(S.me&&!$('#modal').innerHTML&&!S.form)render()},3500)}
/* minimal .xlsx writer: stored (uncompressed) zip of SpreadsheetML parts */
function xlsx(name,sheets){const E=new TextEncoder(),x=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const col=i=>{let t='';i++;while(i){const m=(i-1)%26;t=String.fromCharCode(65+m)+t;i=(i-m-1)/26}return t};

function compare(bwr,portal){
 const norm=s=>String(s).trim().replace(/\.0+$/,''),agg=arr=>{const m={};arr.forEach(b=>{const k=norm(b.no),r=m[k]||(m[k]={no:k,date:b.date,total:0,net:0,tax:0,status:b.status||''});r.total=r2(r.total+b.total);r.net=r2(r.net+b.net);r.tax=r2(r.tax+b.tax)});return m};
 const A=agg(bwr),P=agg(portal),z={date:'',no:'',total:0,net:0,tax:0,status:''};
 const rows=[...new Set([...Object.keys(A),...Object.keys(P)])].sort().map(k=>{const a=A[k]||z,p=P[k]||z,v={net:r2(a.net-p.net),tax:r2(a.tax-p.tax),total:r2(a.total-p.total)};
  return{a,p,v,rem:!P[k]?'Not found in portal':!A[k]?'Not found in uploaded file':(v.net||v.tax||v.total)?'Variance Found':'Matched'}});
 const counts={};rows.forEach(r=>counts[r.rem]=(counts[r.rem]||0)+1);return{rows,counts};
}

 w.querySelector('.ddl').innerHTML=[...s.options].map((o,i)=>`<div class="opt ${i==s.selectedIndex?'on':''}" data-k="${esc(o.text.toLowerCase())}" onclick="ssPick('${id}',${i})">${esc(o.text)}</div>`).join('');
 q.value='';ddToggle(id);if(w.classList.contains('open'))setTimeout(()=>q.focus(),0)}
function ssF(id,q){q=q.toLowerCase();$('#'+id).querySelectorAll('.ddl .opt').forEach(o=>o.style.display=o.dataset.k.includes(q)?'':'none')}
function ssPick(id,i){const w=$('#'+id),s=w.querySelector('select');w.classList.remove('open');if(s.selectedIndex!=i){s.selectedIndex=i;ssSync(w);s.dispatchEvent(new Event('change',{bubbles:true}))}}
function ssKey(e,id){if(e.key=='Escape'){e.stopPropagation();$('#'+id).classList.remove('open')}if(e.key!='Enter')return;e.preventDefault();const o=[...$('#'+id).querySelectorAll('.ddl .opt')].find(x=>x.style.display!='none');o&&o.click()}
new MutationObserver(()=>document.querySelectorAll('select:not([data-ss])').forEach(ssWrap)).observe(document.body,{childList:true,subtree:true});
function ddF(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' .ddl label').forEach(l=>l.style.display=l.dataset.k.includes(q)?'':'none')}
function searchRecon(){search('recon');if(S.ap&&S.ap.kind=='recon'){S.ap.status=S.fd.status||'';render()}}
function pRecon(){
 const ap=S.ap&&S.ap.kind=='recon'?S.ap:null;
 const rows=ap?S.rreqs.filter(r=>ap.stores.includes(r.store)&&r.upDate>=ap.from&&r.upDate<=ap.to&&(!ap.status||r.status==ap.status)):[];
 const cols=[['Request #','id'],['Store','s','h'],['Sales period','p'],['Uploaded','u','h'],['Status','st','h'],['Uploaded file','uf','h'],['Generated file','gf','h']];
 return head('Reconciliations')+
 `<div class="card rf"><div class="fbar">${storePicker(reconStores())}${datePicker()}${sdd('rsel',[['','All statuses'],...RSTAT.map(x=>[x,x])],S.fd.status||'','All statuses','activity','status')}<button class="btn pr" onclick="searchRecon()">${ic('search')}Search</button><a class="fclr" onclick="resetF()" style="${ap?'':'display:none'}">${ic('x')}Clear filters</a>${can('recon.new:create')?`<button class="btn pr fact" onclick="go('recon/new')">${ic('upload')}Recon Request</button>`:''}</div></div>
 <div class="card rt"><div class="ch"><h3>Data (${rows.length})</h3></div><div class="rbody">${ap?tbl(cols,pageRows(rows).map(r=>({id:r.id,s:scell(r.store),p:dshort(r.from)+' → '+dshort(r.to),u:`${r.at}<br><small>@${esc(r.by)}</small>`,st:B(r.status,RQC[r.status]??'rd')+(r.mapv?`<br><small>Mapping v${r.mapv}</small>`:''),
  uf:`<a href="javascript:void 0" onclick="toast('Downloading ${esc(r.file)}')" class="cell">${ic('file')}${esc(r.file)}</a>`,gf:r.status=='Completed'&&can('recon.list:download')?`<button class="btn sm" onclick="openReq(${r.id})">${ic('scale')}Recon Report</button>`:''})))+pager(rows.length):empty('<b style="color:var(--ink)">No data to show</b><p style="margin-top:4px">Select a store and an upload date range, then click Search.</p>','search')}</div></div>`}
function openReq(id){const r=S.rreqs.find(x=>x.id==id);ev('ARMS Integration API',`Fresh 5-minute download link issued for Recon Report #${id}`);viewRecon(r.res,'Reconciliation report',`${sname(r.store)} · ${r.from} → ${r.to} · Report data as of ${r.asof}`)}
function pReconNew(){
 const live=reconStores().filter(s=>S.arms[s.code].stage==6),f=S.rn||(S.rn={file:'',size:''});
 return head('Recon Request')+`<div class="card rq"><div class="cb">
 <div class="form2"><div class="fld">Store *${storePicker(live)}</div><div class="fld">Sales period *${datePicker()}</div></div>
 <div class="fld">Concessionaire BWR *
 <label class="drop dz" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();pickBwr(event.dataTransfer.files[0])">
 <input type="file" accept=".csv,.xlsx" hidden onchange="pickBwr(this.files[0])"><div class="di">${ic('upload')}</div>
 ${f.file?`<span class="file">${ic('file')}${esc(f.file)}${f.size?`<small>${f.size}</small>`:''}</span><p class="mu" style="font-size:12.5px;margin-top:8px">Click to choose a different file</p>`:'<b>Click to browse or drag the file here</b><p class="mu" style="font-size:12.5px;margin-top:3px">CSV or XLSX · up to 50 MB</p>'}</label>
 <div class="samples"><small>Demo files:</small><a onclick="sampleBwr(0)">Matching</a><a onclick="sampleBwr(1)">Wrong type (.csv)</a><a onclick="sampleBwr(2)">Old template</a></div></div>
 </div><div class="rqf"><button class="btn" onclick="S.rn=null;go('recon')">Cancel</button><button class="btn pr" id="upb" onclick="submitRecon()">${ic('upload')}Upload</button></div></div>`}
function pickBwr(file){if(!file)return;if(!/\.(csv|xlsx)$/i.test(file.name))return toast('File must be .csv or .xlsx','rd');if(file.size>50*1024*1024)return toast('File is too large. The limit is 50 MB.','rd');
 S.rn.file=file.name;S.rn.size=(file.size/1024).toFixed(0)+' KB';render()}
function sampleBwr(i){const c=S.fd.stores[0];if(!c)return toast('Select a store','rd');S.rn.file=[`BWR_${c}_${S.fd.from||D(-1)}.xlsx`,`BWR_${c}.csv`,`BWR_${c}_old_template.xlsx`][i];S.rn.size='';render()}
function submitRecon(){
 const f=S.fd,e=m=>toast(m,'rd');if(!f.stores.length)return e('Select a store');if(!f.from)return e('Select a sales period');if(!S.rn.file)return e('Choose the BWR file');
 const b=$('#upb');b.disabled=true;b.textContent='Uploading...';const store=f.stores[0],file=S.rn.file;
 setTimeout(()=>{const r={id:S.rreqs.length+1,store,from:f.from,to:f.to,file,status:'Submitted',by:S.me.u,at:stamp(),upDate:D(0)};S.rreqs.unshift(r);toast('BWR uploaded. Request submitted.');S.rn=null;
  if(!can('recon.list:view')){render();return}go('recon');S.fd={stores:[store],from:D(0),to:D(0)};S.ap={kind:'recon',stores:[store],from:D(0),to:D(0),status:''};render()},900)}
function procRecon(r){
 const m=S.rmaps[r.store];let st='Completed';
 if(!m)st='Mapping Not Found';else if((m.type=='Excel')!=r.file.endsWith('.xlsx'))st='Incorrect File Format Uploaded';else if(r.file.includes('old_template'))st='Headers not matching with mapping';
 const portal=Object.values(S.olap.bd||{}).filter(b=>b.store==r.store&&b.date>=r.from&&b.date<=r.to);
 if(st=='Completed'&&!portal.length)st='No bills found in portal for the selected period';
 if(st=='Completed'){const bwr=portal.map(b=>({no:b.no+(b===portal[0]?'.0':''),date:b.date,total:b.total,net:b.net,tax:b.tax}));
  if(bwr.length>1){bwr[1].tax=r2(bwr[1].tax+0.5);bwr[1].total=r2(bwr[1].total+0.5)}if(bwr.length>3)bwr.splice(3,1);bwr.push({no:r.store+'-0999',date:r.from,total:236.25,net:225,tax:11.25});
  r.res=compare(bwr,portal);r.asof=D(0)+' '+tm(S.lastJob)}
 r.status=st;if(m)r.mapv=m.v;ev('Reconciliation Job',`Request #${r.id}: read BWR with the store's mapping, read OLAP bill details for ${r.from} → ${r.to}, compared bill by bill → ${st}${st=='Completed'?'; Excel report saved to S3':''}`)}
/* ===== Data Availability (per store, live, Yes/No; only No rows listed) ===== */
const nscin=c=>(S.arms[c]&&S.arms[c].cfg&&S.arms[c].cfg.nscin)||'—';
function dayList(a,b){const r=[];let d=new Date(a+'T00:00');while(ds(d)<=b){r.push(ds(d));d.setDate(d.getDate()+1)}return r}
function ranges(days){const out=[];days.forEach(d=>{const l=out[out.length-1];if(l&&dayList(l[1],d).length==2)l[1]=d;else out.push([d,d])});return out.map(([a,b])=>a==b?dshort(a):dshort(a)+' – '+dshort(b)).join(', ')}
function availFor(code,from,to){const y=D(-1),last=to>y?y:to,bills=S.bills.filter(b=>b.store==code&&b.date>=from&&b.date<=last),days={};
 bills.forEach(b=>{const d=days[b.date]||(days[b.date]={tot:0,syn:0});d.tot++;if(b.synced)d.syn++});
 const ld=days[last];if(ld&&ld.syn)return{status:'Yes'};
 let remark;
 if(!bills.length)remark='No sync recorded for this store in this period';
 else if(ld&&ld.tot)remark='Inserted into Transactional DB: Bills are yet to sync to reports';
 else{const err=S.logs.find(l=>l.kind=='error'&&l.store==code&&l.t.slice(0,10)==last);remark=err?'Error reported by store: '+err.msg:`No data received for ${dshort(last)} (earlier days have data)`}
 const first=bills.length?Object.keys(days).sort()[0]:from;
 return{status:'No',period:ranges(dayList(first,last).filter(d=>!(days[d]&&days[d].syn))),remark}}
function pAvail(){const ap=S.ap&&S.ap.kind=='dqa'?S.ap:null;
 const rows=ap?ap.stores.map(c=>({c,...availFor(c,ap.from,ap.to)})).filter(r=>r.status=='No').map((r,i)=>({sno:i+1,ns:nscin(r.c),sc:scell(r.c),name:sname(r.c),period:r.period,remark:r.remark})):[];
 const cols=[['NSCIN','ns'],['Store Name','sc','h'],['Data Unavailability Period','period'],['Remarks','remark']];
 return head('Data Availability')+`<div class="card rf"><div class="fbar">${storePicker(reconStores())}${datePicker()}<button class="btn pr" onclick="search('dqa')">${ic('search')}Search</button><a class="fclr" onclick="resetF()" style="${ap?'':'display:none'}">${ic('x')}Clear filters</a></div></div>
 <div class="card rt"><div class="ch"><h3>Data (${rows.length})</h3><button class="btn sm" ${ap&&rows.length&&can('dq.avail:download')?'':'disabled'} onclick="availDl()">${ic('download')}Download</button></div><div class="rbody">${!ap?empty('<b style="color:var(--ink)">No data to show</b><p style="margin-top:4px">Select a store and a date range, then click Search.</p>','search'):rows.length?tbl(cols,pageRows(rows))+pager(rows.length):empty('<b style="color:var(--ink)">Data is available for this period</b><p style="margin-top:4px">Synced bills were found up to the latest day.</p>','check')}</div></div>`}
function availDl(){const ap=S.ap,rows=ap.stores.map(c=>({c,...availFor(c,ap.from,ap.to)})).filter(r=>r.status=='No');
 xls(`Data_Availability_${ap.from}_to_${ap.to}.xls`,[['Data Availability',['Sno','NSCIN','Store Name','Data Unavailability Period','Remarks'],rows.map((r,i)=>[i+1,nscin(r.c),store(r.c).name,r.period,r.remark])]])}
function xls(name,sheets){const x=v=>String(v??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
 const ws=sheets.map(([n,cols,rows])=>`<Worksheet ss:Name="${x(n)}"><Table>${[cols,...rows].map((r,i)=>`<Row>${r.map(c=>`<Cell${i?'':' ss:StyleID="h"'}><Data ss:Type="${typeof c=='number'?'Number':'String'}">${x(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`).join('');
 const t=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/></Style></Styles>${ws}</Workbook>`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/vnd.ms-excel'}));a.download=name;a.click()}

/* ===== Data Quality Check (request queue -> job -> 3-sheet Excel) ===== */
const DQST={1:'Request Submitted',2:'In Progress',3:'Completed',4:'Error'},DQC={1:'',2:'sk',3:'gr',4:'rd'};
function searchDQ(){const f=S.fd;if(!f.stores.length&&!f.from&&!f.status){S.ap=null;S.page=1;render();return}
 S.ap={kind:'dq',stores:f.stores.slice(),from:f.from,to:f.to,status:f.status||''};S.page=1;render()}
function pDQ(){const ap=S.ap&&S.ap.kind=='dq'?S.ap:null;
 const mine=S.dq.filter(r=>reconStores().some(s=>r.stores.includes(s.code))&&(!ap||((!ap.stores.length||ap.stores.some(c=>r.stores.includes(c)))&&(!ap.from||(r.from<=ap.to&&r.to>=ap.from))&&(!ap.status||r.status==ap.status))));
 const cols=[['Request Id','id','h'],['From Date','from'],['To Date','to'],['Store(s)','st','h'],['Status','s','h'],['Action','a','h']];
 return head('Data Quality Check')+`<div class="card rf"><div class="fbar">${storePicker(reconStores())}${datePicker()}${sdd('dsel',[['','All statuses'],...Object.entries(DQST).map(([k,v])=>[k,v])],S.fd.status||'','All statuses','activity','status')}<button class="btn pr" onclick="searchDQ()">${ic('search')}Search</button><a class="fclr" onclick="resetF()" style="${ap?'':'display:none'}">${ic('x')}Clear filters</a>${can('dq.quality:create')?`<button class="btn pr fact" onclick="go('dq/new')">${ic('plus')}Raise Request</button>`:''}</div></div>
 <div class="card rt"><div class="ch"><h3>Data (${mine.length})</h3></div><div class="rbody">${tbl(cols,pageRows(mine).map((r,i)=>({sno:i+1,id:`<span class="mono">${r.id}</span>`,from:dshort(r.from),to:dshort(r.to),
  st:`<span title="${esc(r.stores.map(sname).join(', '))}" class="chip">${r.stores.length} store${r.stores.length>1?'s':''}</span>`,s:B(DQST[r.status],DQC[r.status]),
  a:r.status==3?(can('dq.quality:download')?`<button class="btn sm" onclick="dqDl('${r.id}')">${ic('download')}Download</button>`:''):r.status==4?`<small style="color:var(--rd)">${esc(r.reason)}</small>`:'<small>—</small>'})))+pager(mine.length)}</div></div>`}
function pDQNew(){const live=reconStores();
 return head('Raise Request')+`<div class="card rq"><div class="cb"><div class="form2">
 <div class="fld">Stores *${mtag('dqst','stores',live.map(s=>[s.code,sname(s.code)]),[],'Add store')}</div><div class="fld">Date range *${datePicker()}</div></div></div>
 <div class="rqf"><button class="btn" onclick="go('dq/quality')">Cancel</button><button class="btn pr" onclick="dqSubmit()">Submit Request</button></div></div>`}
function dqSubmit(){const st=[...document.querySelectorAll('#dqst input[name=stores]')].map(i=>i.value),f=S.fd,e=m=>toast(m,'rd');
 if(!st.length)return e('Select at least one store');if(!f.from)return e('Select a date range');if((new Date(f.to)-new Date(f.from))/864e5>30)return e('Date range can be at most 1 month');
 const id='ADQ#'+(S.dq.length+1);S.dq.unshift({id,stores:st,from:f.from,to:f.to,status:1,reason:'',by:S.me.u,at:stamp()});audit('Data quality request raised',id);toast(`${id} submitted`);go('dq/quality')}
function dqCompute(r){const seen=new Set(),bills=S.bills.filter(b=>r.stores.includes(b.store)&&b.date>=r.from&&b.date<=r.to).filter(b=>{const k=b.store+'|'+b.no;if(seen.has(k))return false;seen.add(k);return true});
 if(!bills.length)return null;
 const gaps=[],trend=[],fails=[];
 r.stores.forEach(c=>{const bs=bills.filter(b=>b.store==c),nm=store(c).name,cin=nscin(c);if(!bs.length)return;
  const grp={};bs.forEach(b=>{const m=String(b.no).match(/^(.*?)(\d+)$/);if(!m)return;const k=m[1]+'|'+m[2].length;(grp[k]=grp[k]||[]).push(+m[2])});
  Object.entries(grp).forEach(([k,ns])=>{const [pre,w]=k.split('|'),mn=Math.min(...ns),mx=Math.max(...ns);if(mx-mn>1e6)return;const have=new Set(ns),miss=[];for(let i=mn;i<=mx;i++)if(!have.has(i))miss.push(pre+String(i).padStart(+w,'0'));if(miss.length)gaps.push([nm,cin,miss.join(', ')])});
  const cnt=d=>S.bills.filter(b=>b.store==c&&b.date==d).length;
  dayList(r.from,r.to).forEach(d=>{const p=new Date(d+'T00:00');p.setDate(p.getDate()-1);const cur=bs.filter(b=>b.date==d).length,prev=cnt(ds(p)),diff=cur-prev,pct=prev?Math.round(diff/prev*1000)/10:(cur?100:0);
   trend.push([nm,cin,d,cur,prev,diff,pct+'%',Math.abs(pct)>=20?'Yes':'No'])});
  const f=bs.filter(b=>!b.synced).map(b=>b.no);if(f.length)fails.push([nm,cin,f.join(', ')])});
 return{gaps,trend,fails}}
function dqDl(id){const r=S.dq.find(x=>x.id==id);
 xls(`DataQuality_${id.replace('#','')}.xls`,[['Bill Sequence Gaps',['Store Name','CIN','Missing Bill Numbers'],r.res.gaps],['Volume Trend',['Store Name','CIN','Date','Bill Count','Previous Day Count','Difference','% Change','Drop/Spike Alert'],r.res.trend],['Sync Failures',['Store Name','CIN','Failed Bill Numbers'],r.res.fails]])}
setInterval(()=>{if(!S||!S.dq)return;let ch=false;
 S.dq.filter(r=>r.status==2).forEach(r=>{const res=dqCompute(r);if(res){r.res=res;r.status=3}else{r.status=4;r.reason='No data found for the selected stores and period'}ch=true});
 S.dq.filter(r=>r.status==1).reverse().slice(0,5).forEach(r=>{r.status=2;ch=true});
 if(ch&&PATH=='dq/quality'&&!$('#modal').innerHTML&&!S.form)render()},4000);
setInterval(()=>{if(!S)return;let ch=false;
 S.rreqs.filter(r=>r.status=='In Progress').forEach(r=>{procRecon(r);ch=true});
 S.rreqs.filter(r=>r.status=='Submitted').reverse().slice(0,3).forEach(r=>{r.status='In Progress';ch=true;ev('Reconciliation Job',`Picked request #${r.id} (oldest first) → In Progress`)});
 if(ch&&PATH=='recon'&&!$('#modal').innerHTML&&!S.form)render()},4000);
function searchMaps(){if(!S.fd.stores.length){S.ap=null;S.page=1;render();return}S.ap={kind:'maps',stores:S.fd.stores.slice()};S.page=1;render()}
function pReconMaps(){
 const ap=S.ap&&S.ap.kind=='maps'?S.ap:null,rows=reconStores().filter(s=>S.rmaps[s.code]&&(!ap||ap.stores.includes(s.code)));
 const cols=[['Store','s','h'],['Version','ver'],['File type','type','h'],['Headers: bill no · date · amount · net · tax','h1','h'],['Last changed','at'],['By','by'],['Action','a','h']];
 return head('Recon File Mappings')+
 `<div class="card rf"><div class="fbar">${storePicker(reconStores())}<button class="btn pr" onclick="searchMaps()">${ic('search')}Search</button><a class="fclr" onclick="resetF()" style="${ap?'':'display:none'}">${ic('x')}Clear filters</a>${can('recon.maps:create')?`<button class="btn pr fact" onclick="mapModal()">${ic('plus')}New mapping</button>`:''}</div></div>
 <div class="card rt"><div class="ch"><h3>Data (${rows.length})</h3></div><div class="rbody">${tbl(cols,pageRows(rows).map(s=>{const m=S.rmaps[s.code];return{s:scell(s.code),ver:'v'+m.v,type:chip(m.type),h1:m.h.map(h=>`<span class="chip mono">${esc(h)}</span>`).join(''),at:m.at,by:'@'+m.by,a:act(1,'Versions',`mapVers('${s.code}')`)+act(can('recon.maps:edit'),ic('edit')+'Edit',`mapModal('${s.code}')`)+act(can('recon.maps:delete'),ic('trash')+'Delete',`delMap('${s.code}')`,'rd')}}))+pager(rows.length)}</div></div>`}
function mapModal(code,msg){
 const m=code&&S.rmaps[code],H=['Bill number','Bill date','Bill amount (incl. tax)','Net amount (excl. tax)','Tax amount'];
 modal(m?'Edit mapping':'New mapping',(msg?alertx(msg):'')+sel('Store','store',reconStores().map(s=>[s.code,sname(s.code)]),code||'',m?'disabled':'')+sel('File type','type',['Excel','CSV'],m?m.type:'Excel')+`<div class="grid2">${H.map((h,i)=>fld(h+' header','h'+i,m?m.h[i]:'')).join('')}</div>`,
 d=>{const c=code||d.store;if(!code&&S.rmaps[c]){setTimeout(()=>mapModal(c,'Mapping already exists for this store'));return}const h=[0,1,2,3,4].map(i=>(d['h'+i]||'').trim());if(h.some(x=>!x))return 'All fields are required';
  const vs=S.rmapv[c]||(S.rmapv[c]=[]),old=S.rmaps[c],v=vs.reduce((a,x)=>Math.max(a,x.v),0)+1,rec={v,type:d.type,h,by:S.me.u,at:stamp()};vs.push(rec);S.rmaps[c]={...rec};audit('Recon mapping saved',c,[['Version',old?'v'+old.v:'','v'+v]]);ev('ARMS Integration API',`Recon file mapping for ${c} saved in OLTP; applies to every request processed from now on`);toast('Mapping saved')},m?'Save changes':'Create mapping',false)}
function mapVers(c){const vs=(S.rmapv[c]||[]).slice().sort((a,b)=>b.v-a.v),cur=S.rmaps[c];
 modal('Mapping versions · '+esc(sname(c)),`<div class="tw"><table class="t"><thead><tr><th>Version</th><th>File type</th><th>Headers</th><th>Saved</th><th></th></tr></thead><tbody>${vs.map(x=>`<tr><td>v${x.v}</td><td>${x.type}</td><td>${x.h.map(esc).join(', ')}</td><td>${x.at}<br><small>@${esc(x.by)}</small></td><td>${cur&&cur.v==x.v?'Current':can('recon.maps:edit')?`<button type="button" class="btn sm" onclick="mapCur('${c}',${x.v})">Make current</button>`:''}</td></tr>`).join('')}</tbody></table></div>`,null,'',true)}
function mapCur(c,v){const x=S.rmapv[c].find(y=>y.v==v),old=S.rmaps[c];S.rmaps[c]={...x};audit('Recon mapping version changed',c,[['Current version','v'+old.v,'v'+v]]);closeM();toast(`v${v} is now the current mapping`);render()}
function delMap(c){if(!confirm('Delete the reconciliation file mapping for '+sname(c)+'?'))return;delete S.rmaps[c];delete S.rmapv[c];audit('Recon mapping deleted',c);ev('ARMS Integration API',`Recon mapping for ${c} deleted; new requests for it will end with "Mapping Not Found"`);render()}

/* ================= start ================= */
fresh();
window.addEventListener('hashchange',()=>{ROUTE=location.hash.slice(2)||'login';render()});render();
